version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dotnet-foundation:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.NET.Test.Sdk"
      avalonia:
        patterns:
          - "Avalonia*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
