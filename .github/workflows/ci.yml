name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore windows/src/Markstash.Desktop/Markstash.Desktop.csproj --runtime win-x64 --configfile windows/NuGet.Config
          dotnet restore windows/tests/Markstash.Tests/Markstash.Tests.csproj --configfile windows/NuGet.Config

      - name: Build desktop host
        run: dotnet build windows/src/Markstash.Desktop/Markstash.Desktop.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test windows/tests/Markstash.Tests/Markstash.Tests.csproj --configuration Release --no-restore

      - name: Publish Windows application
        run: >-
          dotnet publish windows/src/Markstash.Desktop/Markstash.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/windows-publish

      - name: Archive Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path "artifacts/windows-publish/*" -DestinationPath "artifacts/Markstash-windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: Markstash-windows
          path: artifacts/Markstash-windows.zip
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Test, lint, and assemble
        working-directory: android
        run: >-
          bash ./gradlew
          :core:model:testDebugUnitTest
          :core:platform:testDebugUnitTest
          :core:designsystem:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          --no-configuration-cache

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Markstash-android-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Markstash-android-debug
          path: artifacts/Markstash-android-debug.apk
          if-no-files-found: error
