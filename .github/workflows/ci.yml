name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore src/Markstash.Desktop/Markstash.Desktop.csproj --configfile NuGet.Config
          dotnet restore tests/Markstash.Tests/Markstash.Tests.csproj --configfile NuGet.Config

      - name: Build desktop host
        run: dotnet build src/Markstash.Desktop/Markstash.Desktop.csproj --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test tests/Markstash.Tests/Markstash.Tests.csproj
          --configuration Release
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-windows
          path: artifacts/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 17

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore src/Markstash.Android/Markstash.Android.csproj --configfile NuGet.Config

      - name: Build APK
        run: dotnet build src/Markstash.Android/Markstash.Android.csproj --configuration Release --no-restore --property:AndroidSdkDirectory="$ANDROID_HOME"
