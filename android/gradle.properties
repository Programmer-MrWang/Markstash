org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.vfs.watch=true
kotlin.code.style=official
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Keep debug APKs installable when they are copied off the development machine.
# Android Studio's Run action may otherwise inject android:testOnly="true".
android.injected.testOnly=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
